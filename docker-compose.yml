services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?define SA_PASSWORD en .env (ver .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # depends_on alone doesn't wait for SQL Server to accept connections.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=CartAPI;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?define JWT_KEY en .env (ver .env.example)}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4200}
    ports:
      - "8080:8080"

volumes:
  sqldata:
